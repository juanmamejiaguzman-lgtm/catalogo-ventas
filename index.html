    <header class="topbar">
      <button class="brand brand--mini" id="homeBtn" type="button" hidden>
        <img src="assets/logo.png" alt="Botero" />
      </button>
      <p class="company" id="companyLabel">CI Piscícola Botero SA</p>
      <div class="controls">
        <div class="lang" id="massSwitch" role="group" data-i18n-aria="massLabel">
          <button type="button" data-mass="kg" class="is-active">kg</button>
          <button type="button" data-mass="lb">lb</button>
        </div>
        <div class="lang" role="group" aria-label="Idioma">
          <button type="button" data-lang="es" class="is-active">ES</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="pt">PT</button>
          <button type="button" data-lang="zh">中文</button>
        </div>
      </div>
    </header>

    <main>
      <section class="stage is-active" id="stage-welcome" data-stage="welcome">
        <p class="eyebrow" data-i18n="welcomeEyebrow"></p>
        <h1 class="sr-only">CI Piscícola Botero SA</h1>
        <button class="logo-wrap" id="enterBtn" type="button">
          <span class="ripple"></span>
          <span class="ripple delay"></span>
          <img class="logo" src="assets/logo.png" alt="Botero" />
          <span class="logo-hint" data-i18n="enterHint"></span>
        </button>
        <figure class="video-stage">
          <figcaption class="video-kicker" data-i18n="videoTitle"></figcaption>
          <a
            class="video-frame"
            id="videoFrame"
            href="https://www.youtube.com/watch?v=MnM2skg9Bl4"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="https://img.youtube.com/vi/MnM2skg9Bl4/hqdefault.jpg"
              alt="Video de CI Piscícola Botero SA"
            />
            <span class="play-btn" aria-hidden="true"></span>
          </a>
        </figure>
        <p class="lede" data-i18n="welcomeLede"></p>
        <nav class="socials" id="socialsWelcome" data-i18n-aria="socialLabel">
          <a class="social" data-network="youtube" href="https://www.youtube.com/watch?v=MnM2skg9Bl4" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4L16 12l-6.4 3.6z"/></svg>
            <span>YouTube</span>
          </a>
          <a class="social" data-network="instagram" href="https://www.instagram.com/piscicolabotero/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zm10 2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-5 3.2A3.8 3.8 0 1 1 8.2 12 3.8 3.8 0 0 1 12 8.2zm0 1.8A2 2 0 1 0 14 12a2 2 0 0 0-2-2zm4.7-2.6a.9.9 0 1 1-.9.9.9.9 0 0 1 .9-.9z"/></svg>
            <span>Instagram</span>
          </a>
          <a class="social" data-network="facebook" href="https://www.facebook.com/piscicolabotero/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v2H8v3h2v7h3v-7h3l1-3h-4V10c0-.6.4-1 1-1z"/></svg>
            <span>Facebook</span>
          </a>
        </nav>
      </section>

      <section class="stage" id="stage-products" data-stage="products">
        <h2 data-i18n="productsTitle"></h2>
        <p class="lede" data-i18n="productsLede"></p>
        <nav class="socials socials--compact" id="socialsProducts" data-i18n-aria="socialLabel">
          <a class="social" data-network="youtube" href="https://www.youtube.com/watch?v=MnM2skg9Bl4" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4L16 12l-6.4 3.6z"/></svg>
            <span>YouTube</span>
          </a>
          <a class="social" data-network="instagram" href="https://www.instagram.com/piscicolabotero/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zm10 2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-5 3.2A3.8 3.8 0 1 1 8.2 12 3.8 3.8 0 0 1 12 8.2zm0 1.8A2 2 0 1 0 14 12a2 2 0 0 0-2-2zm4.7-2.6a.9.9 0 1 1-.9.9.9.9 0 0 1 .9-.9z"/></svg>
            <span>Instagram</span>
          </a>
          <a class="social" data-network="facebook" href="https://www.facebook.com/piscicolabotero/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v2H8v3h2v7h3v-7h3l1-3h-4V10c0-.6.4-1 1-1z"/></svg>
            <span>Facebook</span>
          </a>
        </nav>
        <div class="cards" id="productCards"></div>
      </section>

      <section class="stage" id="stage-color" data-stage="color">
        <button class="back" id="backToProductsFromColor" type="button" data-i18n="back"></button>
        <h2 data-i18n="colorTitle"></h2>
        <p class="lede" id="colorContext"></p>
        <p class="lede" data-i18n="colorLede"></p>
        <div class="cards cards-2" id="colorCards"></div>
      </section>

      <section class="stage" id="stage-config" data-stage="config">
        <button class="back" id="backToProducts" type="button" data-i18n="back"></button>
        <div class="config-hero">
          <div class="preview-stack">
            <figure class="photo-frame">
              <figcaption data-i18n="productPreview"></figcaption>
              <div class="frame-body" id="configArt"></div>
            </figure>
            <figure class="photo-frame">
              <figcaption data-i18n="packPreview"></figcaption>
              <div class="frame-body" id="packArt"></div>
            </figure>
          </div>
          <div>
            <h2 id="configTitle"></h2>
            <p class="sci" id="configSci"></p>
            <p class="lede" id="configLede"></p>
            <p class="note" id="shipHint" hidden></p>
          </div>
        </div>
        <form class="config" id="orderForm">
          <fieldset id="processField" hidden>
            <legend data-i18n="process"></legend>
            <div class="chips" id="processChips"></div>
          </fieldset>
          <fieldset id="sizeField" hidden>
            <legend data-i18n="size"></legend>
            <div class="lang" id="filletUnitSwitch" hidden>
              <button type="button" data-fillet-unit="oz" class="is-active">oz</button>
              <button type="button" data-fillet-unit="g">g</button>
            </div>
            <div class="chips" id="sizeChips"></div>
          </fieldset>
          <fieldset id="freezeField" hidden>
            <legend data-i18n="freeze"></legend>
            <div class="chips" id="freezeChips"></div>
          </fieldset>
          <fieldset id="packPrimaryField" hidden>
            <legend data-i18n="packPrimaryTitle"></legend>
            <div class="chips" id="packPrimaryChips"></div>
          </fieldset>
          <fieldset id="packSecondaryField" hidden>
            <legend data-i18n="packSecondaryTitle"></legend>
            <div class="chips" id="packSecondaryChips"></div>
          </fieldset>
          <fieldset id="packFixedField" hidden>
            <legend data-i18n="packaging"></legend>
            <div class="chips" id="packFixedChips"></div>
          </fieldset>
          <fieldset id="termoSizeField" hidden>
            <legend data-i18n="termoSize"></legend>
            <div class="chips" id="termoSizeChips"></div>
          </fieldset>
          <fieldset class="grid-2">
            <label>
              <span data-i18n="quantity"></span>
              <input type="number" id="qty" min="1" step="0.01" value="100" required />
            </label>
            <label>
              <span data-i18n="unit"></span>
              <select id="unit"></select>
            </label>
          </fieldset>
          <fieldset class="grid-2">
            <label>
              <span data-i18n="clientName"></span>
              <input type="text" id="clientName" autocomplete="name" required />
            </label>
            <label>
              <span data-i18n="clientCompany"></span>
              <input type="text" id="clientCompany" autocomplete="organization" required />
            </label>
          </fieldset>
          <fieldset class="grid-2">
            <label>
              <span data-i18n="city"></span>
              <input type="text" id="city" autocomplete="address-level2" required />
            </label>
            <label>
              <span data-i18n="country"></span>
              <input type="text" id="country" autocomplete="country-name" required />
            </label>
          </fieldset>
          <div class="dest-suggest" id="destSuggest"></div>
          <fieldset>
            <label>
              <span data-i18n="clientEmail"></span>
              <input type="email" id="clientEmail" autocomplete="email" required />
            </label>
          </fieldset>
          <fieldset>
            <legend data-i18n="incoterm"></legend>
            <div class="chips" id="incotermChips"></div>
          </fieldset>
          <button class="cta" type="submit" data-i18n="reviewOrder"></button>
        </form>
      </section>

      <section class="stage" id="stage-summary" data-stage="summary">
        <button class="back" id="backToConfig" type="button" data-i18n="back"></button>
        <h2 data-i18n="summaryTitle"></h2>
        <p class="lede" data-i18n="summaryLede"></p>
        <article class="ticket" id="ticket"></article>
        <a class="cta cta--wa" id="waBtn" href="#" target="_blank" rel="noopener">
          <span data-i18n="sendWhatsapp"></span>
        </a>
        <p class="fineprint" data-i18n="disclaimer"></p>
      </section>
    </main>

    <footer>
      <span>CI Piscícola Botero SA</span>
      <span class="dot"></span>
      <span data-i18n="footerNote"></span>
    </footer>

    <script src="js/app.js?v=oct7"></script>
  </body>
</html>
